name: documentation

on:
  push:
    branches:
      - validation/documentation

permissions:
  contents: read

jobs:
  docs:
    name: docs-${{ matrix.pr }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 9160
            head: f2daf741b2b6972bde9b3dd1d58bd6a7bf551327
          - pr: 9161
            head: 2f9090c54feb0bc31551b18f76ef10d68b6f1081
    steps:
      - name: Check out PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.head }}
          persist-credentials: false
      - name: Set up documentation Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Verify revision and whitespace
        env:
          PR_HEAD: ${{ matrix.head }}
          PR_BASE: 5c25ce99468505237036232dc41b12f89ff7a07d
        run: |
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          git fetch --no-tags --depth=1 origin "$PR_BASE"
          git diff --check "$PR_BASE" HEAD
      - name: Install documentation requirements
        run: python -m pip install -r docs/requirements.txt
      - name: Build documentation strictly
        run: python -m mkdocs build --strict
